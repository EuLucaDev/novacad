[package]
name = "novacad-engine"
description = "NovaCad engine: sessions, commands, the command line and prompts, snaps, selection, undo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
novacad-geom = { workspace = true }
novacad-color = { workspace = true }
novacad-doc = { workspace = true }
novacad-dxf = { workspace = true }
novacad-constraints = { workspace = true }
novacad-fonts = { workspace = true }
novacad-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# R-tree spatial index for picking, window selection and object snaps (MIT OR Apache-2.0).
rstar = { version = "0.12", default-features = false }

[dev-dependencies]
# Real DXF files for the external reference tests (io is a lower layer).
novacad-io = { workspace = true }
