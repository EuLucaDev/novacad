[package]
name = "novacad-ui-egui"
description = "NovaCad user interface (egui): the swappable front end"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[lints]
workspace = true

[dependencies]
nova-ui = { workspace = true }
novacad-geom = { workspace = true }
novacad-color = { workspace = true }
novacad-doc = { workspace = true }
novacad-render = { workspace = true }
novacad-engine = { workspace = true }
novacad-fonts = { workspace = true }
egui = { workspace = true }
# GPU canvas paint callback (same egui-wgpu/wgpu eframe uses with its "wgpu" feature).
egui-wgpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# Validates the canvas WGSL and its GLSL ES 3.0 (WebGL2) translation in tests (same naga wgpu uses).
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nova-account-ui = { git = "https://github.com/EuLucaDev/nova-live", rev = "25720ad8a7aa8cc6e10ffd13091bd69873d9fd95" }
# Colaboração em tempo real dos apps Nova Foods (convites, sessão, relay live.agcunae.com).
nova-live = { git = "https://github.com/EuLucaDev/nova-live", rev = "25720ad8a7aa8cc6e10ffd13091bd69873d9fd95" }
